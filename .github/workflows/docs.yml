name: Docs

# Builds the VitePress site in docs/ and publishes it to GitHub Pages.
#
# Deploys from an artifact rather than a gh-pages branch, so the built site never lands in git
# history and the repo keeps only sources.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
  # So a docs fix can be published without an unrelated commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel a running deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress reads git history to show each page's last-updated time.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
